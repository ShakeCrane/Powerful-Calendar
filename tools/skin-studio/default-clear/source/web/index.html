<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="color-scheme" content="light dark"><title>PowerCal Clear</title><link rel="stylesheet" href="clear-design.css"><link rel="stylesheet" href="style.css"></head>
<body><main id="app" aria-label="PowerCal">
<header class="clear-head"><div class="clear-brand"><span id="dayTitle">今天</span><small id="dateSubtitle">日历 · Clear</small></div><div class="toolbar glass">
<button data-action="today" aria-label="返回今天" title="返回今天">今日</button>
<button data-action="memo" title="Memo">Memo <small id="memoCounter"></small></button>
<button data-action="openDeck" title="草稿">待办 <small id="pendingCounter"></small></button>
<button data-action="createDraft" data-kind="ACTIVITY" title="新建活动">＋</button>
</div></header>
<section id="timelinePage" class="page">
<div class="section-label">时间轴 <span id="timeRangeLabel"></span></div>
<div class="timeline-view-controls" role="group" aria-label="时间轴缩放与复位">
<button type="button" data-action="zoomTimeline" data-direction="out" aria-label="缩小时间轴，显示更多小时" title="缩小时间轴">−</button>
<button type="button" data-action="zoomTimeline" data-direction="in" aria-label="放大时间轴，显示更少小时" title="放大时间轴">＋</button>
<button type="button" data-action="resetTimelineZoom" aria-label="重置时间轴缩放为24小时" title="重置为24小时">24h</button>
</div>
<p id="timelineMoveStatus" class="sr-only" role="status" aria-live="polite" aria-atomic="true"></p>
<div id="dateDeadlineBar" class="deadline-date-bar" role="region" aria-label="日期级截止事项" hidden></div>
<div id="axisScroll" class="axis-scroll" role="region" aria-label="时间轴" tabindex="0">
<div class="timeline-surface" id="timelineSurface"><div class="tl-axis" id="tlAxis"></div><div id="timelineLeft" class="timelineWing left" role="region" aria-label="左侧事件泳道，可独立水平滚动" tabindex="0"><div class="timelineLanes"></div></div><div id="timelineRight" class="timelineWing right" role="region" aria-label="右侧事件泳道，可独立水平滚动" tabindex="0"><div class="timelineLanes"></div></div><div id="timeLabels"></div><div id="timeNow"></div></div>
</div><div class="timeline-buttons glass"><button data-action="panTimeline" data-delta-minutes="-180">较早</button><button data-action="panTimeline" data-delta-minutes="180">稍后</button></div></section>
<section id="monthPage" class="page" hidden><div class="page-head"><h1>月历</h1><button data-local="options">导入选项</button><button data-action="today">今天</button></div><div class="month-bar"><button data-action="browseMonth" data-delta-months="-1" aria-label="上个月">‹</button><button id="monthTitle" type="button" aria-haspopup="dialog" aria-label="选择年份和月份"></button><button data-action="browseMonth" data-delta-months="1" aria-label="下个月">›</button></div><div id="monthGrid" class="month-grid"></div><div id="monthAgenda"></div><div class="month-actions"><button data-action="createDraft" data-kind="ACTIVITY">为这一天新建活动</button><button id="viewMonthDate" data-action="jumpTimelineDay">在时间轴查看这一天</button></div><p class="quiet">只显示宿主实际投影的日程；尚未投影到此范围的重复事项不会被推测。</p></section>
<dialog id="monthPickerDialog" aria-labelledby="monthPickerHeading"><form id="monthPickerForm" method="dialog"><h2 id="monthPickerHeading">选择年份和月份</h2><label for="monthYear">年份</label><input id="monthYear" type="number" min="1900" max="2100" required><label for="monthNumber">月份</label><select id="monthNumber"><option value="1">1 月</option><option value="2">2 月</option><option value="3">3 月</option><option value="4">4 月</option><option value="5">5 月</option><option value="6">6 月</option><option value="7">7 月</option><option value="8">8 月</option><option value="9">9 月</option><option value="10">10 月</option><option value="11">11 月</option><option value="12">12 月</option></select><div class="month-picker-actions"><button id="monthPickerCancel" type="button">取消</button><button type="submit">跳转</button></div></form></dialog>
<section id="memoPage" class="page" hidden><div class="page-head"><h1>Memo</h1><button data-action="createMemo">＋ 新建</button></div><div class="tabs"><button data-filter="open" class="selected">未完成</button><button data-filter="done">已完成</button></div><div id="memoList" class="memo-list"></div><button id="memoLimit" class="memo-limit" type="button" data-action="loadMoreMemo" aria-controls="memoList" hidden>加载更多 Memo</button></section>
<section id="aiPage" class="page" hidden><div class="page-head"><h1>AI 助手</h1><button id="chatClear" type="button" aria-label="清空 AI 聊天历史" title="清空 AI 聊天历史">清空聊天</button><button data-action="settings">配置</button></div><div id="aiBatchControls" class="ai-batch-controls" role="group" aria-label="AI 批次操作"><button type="button" data-ai-batch="publish">批量发布草稿</button><button type="button" data-ai-batch="discard">批量丢弃草稿</button><button id="aiBatchCancel" type="button" hidden></button><button id="aiBatchRelease" type="button" hidden>强制解除卡住的批次</button></div><div id="aiBatchStatus" class="ai-batch-status" role="status" aria-live="polite" hidden></div><div id="chatMessages" class="chat-list" aria-live="polite"></div><form id="chatForm"><label for="chatInput">向 AI 发送消息</label><div class="composer"><textarea id="chatInput" maxlength="4000" rows="2" placeholder="描述你的日程需求…"></textarea><button id="chatSend" type="submit">发送</button></div></form></section>
<section id="extraOptions" class="page" hidden><h1>可用选项</h1><div id="optionGroups"></div></section>
<nav class="clear-tabbar glass" aria-label="页面导航"><button data-action="timeline" class="current">时间轴</button><button data-action="month">月历</button><button data-action="memo">Memo</button><button data-action="ai">AI</button><button data-action="settings">设置</button></nav>
<section id="skinSheet" role="dialog" aria-modal="true" aria-label="编辑" hidden>
  <div id="sheetShade" class="sheet-shade"></div>
  <div class="sheet-panel">
    <header class="sheet-head"><button id="sheetClose" aria-label="保存并退出">‹</button><div><strong id="sheetTitle">编辑</strong><small id="sheetSubtitle"></small></div><button id="sheetSave">保存</button></header>
    <div id="sheetStatus" role="status" aria-live="polite"></div>
    <section id="sheetFields" class="sheet-fields"></section>
    <footer id="sheetActions" class="sheet-actions"></footer>
  </div>
</section>
</main><script src="title-folding.js"></script><script src="app.js"></script><script src="edit.js"></script></body></html>
